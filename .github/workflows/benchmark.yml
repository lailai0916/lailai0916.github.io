name: Benchmark Docusaurus Builds

on:
  push:
    branches: [codex/actions-benchmark-20260918]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  benchmark:
    name: Benchmark ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [split, split-repeat, split-no-cache, split-cached, split-cached-repeat]
    env:
      BENCH_VARIANT: ${{ matrix.variant }}
      BENCH_SPLIT: '1'
      BENCH_NO_CONCAT: ${{ startsWith(matrix.variant, 'combined') && '1' || '' }}
      DOCUSAURUS_NO_PERSISTENT_CACHE: ${{ matrix.variant == 'split-no-cache' && '1' || '' }}
      BENCH_LOCALE: ${{ (matrix.variant == 'en' || matrix.variant == 'zh-Hans') && matrix.variant || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check repository
        run: npm run check:ci
      - name: Restore build cache
        if: contains(matrix.variant, 'cached')
        id: cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules/.cache/rspack
          key: ${{ runner.os }}-docusaurus-benchmark-v1-${{ hashFiles('package-lock.json') }}-${{ github.sha }}-${{ matrix.variant }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-benchmark-v1-${{ hashFiles('package-lock.json') }}-
      - name: Apply source probe
        run: |
          printf '\n<span data-ci-benchmark="source-probe-20260918" />\n' >> src/pages/privacy/_content.mdx
          echo 'BENCH_SOURCE_PROBE=source-probe-20260918' >> "$GITHUB_ENV"
      - name: Measure build
        run: node scripts/ci/benchmark.mjs
      - name: Measure cache size
        run: du -sh node_modules/.cache/rspack || true
      - name: Save build cache
        if: contains(matrix.variant, 'cached') && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: node_modules/.cache/rspack
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-${{ matrix.variant }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/benchmark-${{ matrix.variant }}
          retention-days: 7
      - name: Package site
        uses: actions/upload-pages-artifact@v5
        with:
          name: pages-${{ matrix.variant }}
          path: build
