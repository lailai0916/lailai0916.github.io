name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Docusaurus (${{ matrix.locale }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        locale: [en, zh-Hans]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Check repository
        run: npm run check:ci
      - name: Verify automatic Problem imports
        run: node .github/scripts/check-problem-imports.mjs
      - name: Cache Docusaurus build
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/rspack
          key: ${{ runner.os }}-docusaurus-v1-node24-${{ matrix.locale }}-${{ hashFiles('package-lock.json', 'docusaurus.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-docusaurus-v1-node24-${{ matrix.locale }}-${{ hashFiles('package-lock.json', 'docusaurus.config.ts') }}-
      - name: Build website
        env:
          BUILD_LOCALE: ${{ matrix.locale }}
        run: npm run build -- --locale "$BUILD_LOCALE"
      - name: Check performance budgets
        run: python3 .github/scripts/check-performance.py --locale "${{ matrix.locale }}"
      - name: Upload localized build
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ matrix.locale }}
          path: build
          include-hidden-files: true
          retention-days: 1

  publish:
    name: Assemble and publish website
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v5
        with:
          name: site-en
          path: build
      - uses: actions/download-artifact@v5
        with:
          name: site-zh-Hans
          path: build/zh-Hans
      - name: Validate merged site
        run: python3 .github/scripts/validate-build.py

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y rsync

      - name: Configure SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST_FINGERPRINT: SHA256:C8bXBHN5aelwlir94xaNcOhGnCGstFCKqyumQhdxWek
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          host_key="$(ssh-keyscan -T 10 -t ed25519 "$SERVER_HOST" 2>/dev/null)"
          test -n "$host_key"
          fingerprint="$(printf '%s\n' "$host_key" | ssh-keygen -lf - -E sha256 | awk '{print $2}')"
          test "$fingerprint" = "$SERVER_HOST_FINGERPRINT"
          printf '%s\n' "$host_key" > ~/.ssh/known_hosts

      - name: Sync build to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -rlptz --delete --no-o --no-g \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            build/ "${SERVER_USER}@${SERVER_HOST}:/var/www/lailai.one/"

      - name: Verify deployed website and UI documentation
        run: |
          for page in index.html zh-Hans/index.html docs/project/ui/application.html zh-Hans/docs/project/ui/application.html docs/contest/string/trie.html zh-Hans/docs/contest/string/trie.html; do
            url="${page%.html}"
            case "$page" in *index.html) url="${page%index.html}" ;; esac
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
              "https://lailai.one/$url?deployment=$GITHUB_SHA" -o "$RUNNER_TEMP/deployed-page.html"
            cmp "build/$page" "$RUNNER_TEMP/deployed-page.html"
          done
          python3 - <<'PY' > "$RUNNER_TEMP/deployed-assets.txt"
          import pathlib
          from html.parser import HTMLParser
          class EntryAssets(HTMLParser):
              assets = set()
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  asset = attrs.get('src') if tag == 'script' else attrs.get('href') if tag == 'link' and attrs.get('rel') == 'stylesheet' else None
                  if asset and asset.startswith(('/assets/', '/zh-Hans/assets/')):
                      self.assets.add(asset)
          parser = EntryAssets()
          for locale in ('', 'zh-Hans/'):
              parser.feed(pathlib.Path(f'build/{locale}index.html').read_text())
              prefix = f'/{locale}assets/'
              assert any(asset.startswith(prefix) and asset.endswith('.css') for asset in parser.assets), f'No entry CSS found: {locale}'
              assert any(asset.startswith(prefix) and asset.endswith('.js') for asset in parser.assets), f'No entry JavaScript found: {locale}'
          for asset in sorted(parser.assets):
              print(asset)
          PY
          while IFS= read -r asset; do
            curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 \
              "https://lailai.one$asset?deployment=$GITHUB_SHA" -o "$RUNNER_TEMP/deployed-asset"
            cmp "build$asset" "$RUNNER_TEMP/deployed-asset"
          done < "$RUNNER_TEMP/deployed-assets.txt"

  deploy:
    name: Deploy to GitHub Pages
    needs: publish

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
